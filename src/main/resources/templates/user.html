<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
    <title>Spring Security Example</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">

    <span class="text-white" id="userName"></span>

    <span class="ml-2 text-white"
          id="userRoles"
    >
    </span>

    <form class="ml-auto" id="logoutForm">
        <button class="btn btn-light" type="submit">
            Logout
        </button>
    </form>

</nav>
<div class="container-fluid px-3">
    <div class="row">
        <div class="col-2">
            <nav class="nav nav-pills flex-column">
                <a class="nav-link active" href="/user">User</a>
            </nav>
        </div>
        <div class="col-10">
            <h1>User information-page</h1>
            <div class="card">
                <div class="card-header">
                    <h3>About user</h3>
                </div>

                <div class="card-body">
                    <table class="table  table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Role</th>

                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td id="userId"></td>
                            <td id="userNameCell"></td>
                            <td id="userRolesCell"></td>
                        </tr>

                        </tbody>
                    </table>


                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    fetch('/api/users/me')
        .then(response => response.json())
        .then(user => {
            document.getElementById("userName").textContent = user.name;
            document.getElementById("userRoles").textContent = user.roles;
            document.getElementById("userNameCell").textContent = user.name;
            document.getElementById("userRolesCell").textContent = user.roles;
            document.getElementById("userId").textContent = user.id;


        });

    document.getElementById("logoutForm").addEventListener("submit", (event) => {
        event.preventDefault();

        fetch('/api/users/csrf')
            .then(response => response.json())
            .then(data => {
                fetch('/logout', {
                    method: 'POST',
                    headers: {
                        [data.headerName]: data.token
                    }
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = "/login";
                        }
                    });
            });
    });
</script>
</body>
</html>
