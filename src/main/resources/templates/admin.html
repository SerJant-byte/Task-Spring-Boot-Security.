<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <span class="text-white"
          th:text="${#authentication.principal.name}"></span>
    <span class="ml-2 text-white"
          th:each="role : ${#authentication.principal.roles}" th:text="${role.roleName}">
        </span>

    <form class="ml-auto" method="post" action="/logout">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit" class="btn btn-light">Logout</button>

    </form>

</nav>

<div class="container-fluid px-3">
    <div class="row">
        <div class="col-2">
            <nav class="nav nav-pills  flex-column">
                <a class="nav-link active" href="/admin">Admin</a>
                <a class="nav-link" href="/user">User</a>
            </nav>

        </div>

        <div class="col-10">
            <h1>Admin panel</h1>

            <nav class="nav nav-tabs">
                <a class="nav-link active" href="#usersTable" data-toggle="tab">Users table</a>
                <a class="nav-link" href="#newUser" data-toggle="tab">New User</a>
            </nav>

            <div class="tab-content">
                <div class="tab-pane show active" id="usersTable">
                    <div class="card">
                        <div class="card-header">
                            <h3>All users</h3>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Actions</th>

                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.name}"></td>
                                    <td>
                        <span th:each="role : ${user.roles}"
                              th:text="${role.roleName + ' '}">
                        </span>
                                    </td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-primary"
                                                data-toggle="modal"
                                                th:attr="data-target='#editModal' + ${user.id}">
                                            Edit user
                                        </button>
                                        <button type="button" class="btn btn-danger"
                                                data-toggle="modal"
                                                th:attr="data-target='#deleteModal' + ${user.id}">Delete
                                        </button>
                                    </td>

                                </tr>
                                </tbody>

                            </table>

                            <div th:each="user : ${users}">
                                <div class="modal" th:id="'editModal' + ${user.id}">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h4 class="modal-title">Edit user
                                                </h4>
                                                <button type="button" class="close" data-dismiss="modal">
                                                    &times;
                                                </button>
                                            </div>
                                            <div class="modal-body">
                                                <form method="post"
                                                      th:action="@{/admin/{id}/edit(id=${user.id})}"
                                                      th:id="'editForm' + ${user.id}">

                                                    <input type="hidden"
                                                           th:name="${_csrf.parameterName}"
                                                           th:value="${_csrf.token}">

                                                    <div class="form-group">
                                                        <label class="text-center font-weight-bold d-block">Name</label>
                                                        <input class="form-control" type="text" name="name"
                                                               th:value="${user.name}">
                                                    </div>
                                                    <div class="form-group">
                                                        <label class="text-center font-weight-bold d-block">Password</label>
                                                        <input class="form-control" type="password" name="password">
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="text-center font-weight-bold d-block">Role</label>
                                                        <select multiple name="role" class="form-control">
                                                            <option value="ROLE_USER" th:selected="${#lists.contains
                                                                (user.roles.![roleName], 'ROLE_USER')}">USER
                                                            </option>
                                                            <option value="ROLE_ADMIN" th:selected="${#lists.contains
                                                                (user.roles.![roleName], 'ROLE_ADMIN')}">ADMIN
                                                            </option>
                                                        </select>
                                                    </div>


                                                </form>

                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                            data-dismiss="modal">Close
                                                    </button>
                                                    <button type="submit" class="btn btn-primary"
                                                            th:form="'editForm' + ${user.id}">Edit user
                                                    </button>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div th:each="user : ${users}">
                                <div class="modal" th:id="'deleteModal' + ${user.id}">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h4 class="modal-title">Delete user</h4>
                                                <button type="button"
                                                        class="close"
                                                        data-dismiss="modal">
                                                    &times;
                                                </button>
                                            </div>
                                            <div class="modal-body">
                                                <form method="post"
                                                      th:action="@{/admin/{id}/delete(id=${user.id})}"
                                                      th:id="'deleteForm' + ${user.id}">
                                                    <input type="hidden"
                                                           th:name="${_csrf.parameterName}"
                                                           th:value="${_csrf.token}">
                                                </form>

                                                <div class="form-group">
                                                <label class="text-center font-weight-bold d-block">Id</label>
                                                <div class="form-control bg-light text-center" th:text="${user.id}"></div>
                                                </div>

                                                <div class="form-group">
                                                <label class="text-center font-weight-bold d-block">Name</label>
                                                <div class="form-control bg-light text-center" th:text="${user.name}"></div>
                                                </div>

                                                <div class="form-group">
                                                <label class="text-center font-weight-bold d-block">Role</label>
                                                <div class="form-control bg-light text-center">
                                                <span th:each="role : ${user.roles}"
                                                      th:text="${role.roleName + ' '}"></span>
                                                </div>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button"
                                                        class="btn btn-secondary"
                                                        data-dismiss="modal">Close
                                                </button>
                                                <button type="submit"
                                                        class="btn btn-primary"
                                                        th:form="'deleteForm' + ${user.id}">
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="newUser">
                    <div class="card">
                        <div class="card-header">
                            <h3>Add new user</h3>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 offset-md-4">
                                    <form method="post">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">

                                        <div class="form-group">
                                            <label class="text-center font-weight-bold d-block">Name</label>
                                            <input type="text" name="name" class="form-control">
                                        </div>

                                        <div class="form-group">
                                            <label class="text-center font-weight-bold d-block">Password</label>
                                            <input type="password" name="password" class="form-control">
                                        </div>

                                        <div class="form-group">
                                            <label class="text-center font-weight-bold d-block">Role</label>
                                            <select multiple name="role" class="form-control">
                                                <option value="ROLE_USER">USER</option>
                                                <option value="ROLE_ADMIN">ADMIN</option>
                                            </select>
                                        </div>
                                        <div class="text-center">
                                            <button type="submit" class="btn btn-success">Add new user</button>
                                        </div>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>


    </div>
</div>


<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


</body>
</html>
