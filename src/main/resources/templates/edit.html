<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
    <input type="text" name="name" th:value="${user.name}">
    <input type="text" name="password">
    <button type="submit">Edit user</button>
    <select multiple name="role">
        <option value="ROLE_USER" th:selected="${#lists.contains
        (roles.![roleName], 'ROLE_USER')}">USER</option>
        <option value="ROLE_ADMIN" th:selected="${#lists.contains
        (roles.![roleName], 'ROLE_ADMIN')}" >ADMIN</option>
    </select>
</form>

</body>
</html>
